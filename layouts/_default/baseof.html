<!doctype html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}" class="h-full">


{{ partial "head.html" . }}


<body class="min-h-screen flex flex-col">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-stone-700 text-white px-4 py-2 rounded z-50">
        Skip to main content
    </a>
    {{ partial "header.html" . }}
    <main id="main-content" class="flex-1 flex flex-col dark:bg-neutral-500 bg-sky-200 ">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
</body>

</html>
